name = "roxera-mail-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TEMP_TTL_MIN = "15"
TEMP_MAX_AGE_H = "24"
MAX_PERMANENT_PER_USER = "5"
OUTBOUND_DAILY_QUOTA = "100"
CORS_ORIGIN = "https://roxera-mail.pages.dev"

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "ROXERA"
id = "930b65afcb4743b9835e99f670a56a91"

[[send_email]]
name = "SEB"

# Secrets (ставить через `npx wrangler secret put`, НЕ коммитить):
# FIREBASE_PROJECT_ID, FIREBASE_WEB_KEY, FIREBASE_ADMIN_TOKEN, RESEND_API_KEY, INTERNAL_KEY
