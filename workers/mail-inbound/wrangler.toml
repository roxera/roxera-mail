{
  "name": "roxera-mail-inbound",
  "main": "src/index.ts",
  "compatibility_date": "2024-11-01",
  "compatibility_flags": ["nodejs_compat"],
  "workers_dev": true,
  "vars": {
    "TEMP_DOMAINS": "roxera-mail.europe.pp.ua,roxera-mail.mnm.pp.ua,roxera-mail.ajoure.cfd,roxera-mail.roxera.eu.org",
    "PERMANENT_DOMAINS": "europe.pp.ua,mnm.pp.ua,ajoure.cfd,roxera.eu.org",
    "BLOCK_FROM": "",
    "BLOCK_DOMAINS": "",
    "BLOCK_WORDS": "viagra,crypto giveaway,inheritance fund",
    "MAX_MAIL_KB": "5120"
  }
}
# Secrets (wrangler secret put):
# FIREBASE_PROJECT_ID, FIREBASE_ADMIN_TOKEN (OAuth2 access token с правами datastore, обновляется cron'ом; см. SETUP.md),
# MAIL_API_BASE (https://roxera-mail-api.../internal/ingest + INTERNAL_KEY), INTERNAL_KEY
