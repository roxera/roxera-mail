name = "roxera-mail-inbound"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TEMP_DOMAINS = "roxera-mail.europe.pp.ua,roxera-mail.ajoure.cfd"
PERMANENT_DOMAINS = "europe.pp.ua,ajoure.cfd"
BLOCK_FROM = ""
BLOCK_DOMAINS = ""
BLOCK_WORDS = "viagra,crypto giveaway,inheritance fund"
MAX_MAIL_KB = "5120"
MAIL_API_BASE = "https://roxera-mail-api.roxera.workers.dev"

# INTERNAL_KEY ставится только секретом: npx wrangler secret put INTERNAL_KEY
