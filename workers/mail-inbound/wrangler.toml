name = "roxera-mail-inbound"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TEMP_DOMAINS = "roxera-mail.europe.pp.ua,roxera-mail.mnm.pp.ua,roxera-mail.ajoure.cfd,roxera-mail.roxera.eu.org"
PERMANENT_DOMAINS = "europe.pp.ua,mnm.pp.ua,ajoure.cfd,roxera.eu.org"
BLOCK_FROM = ""
BLOCK_DOMAINS = ""
BLOCK_WORDS = "viagra,crypto giveaway,inheritance fund"
MAX_MAIL_KB = "5120"

# Secrets (ставить через `npx wrangler secret put`, НЕ коммитить):
# MAIL_API_BASE (URL mail-api + /internal/ingest), INTERNAL_KEY
# Пример: MAIL_API_BASE=https://roxera-mail-api.<you>.workers.dev
